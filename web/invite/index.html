<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Clear Accounts</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F6F7F9; color: #14171F;
         font-family: system-ui, -apple-system, Roboto, sans-serif; text-align: center; padding: 16px; }
  @media (prefers-color-scheme: dark) { body { background: #0F1115; color: #F3F4F6; } }
  .logo { width: 72px; height: 72px; border-radius: 18px; background: #0E9F6E; margin: 0 auto 16px; display: grid; place-items: center; }
  .logo span { display: block; width: 36px; height: 7px; border-radius: 4px; background: #fff; box-shadow: 0 13px 0 #fff; margin-top: -13px; }
  p { color: #6B7280; }
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true"><span></span></div>
  <h1>Clear Accounts</h1>
  <p>Gastos compartidos y personales, en un solo lugar.</p>
</main>
</body>
</html>
